[project]
name = "ridethewave"
version = "0.1.0"
description = "Momentum trading bot on Alpaca paper trading, with backtester and dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alpaca-py>=0.44,<1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.36",
    "plotly>=5.22",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "loguru>=0.7",
    "pyarrow>=25.0.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
jev = [
    "typesafe-sdk>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ridethewave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP017", "B008", "E741"]
