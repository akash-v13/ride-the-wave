# Ride The Wave settings. Copy to settings.yaml and edit. Secrets go in .env, not here.
# Every parameter is explained in docs/strategy.md.
# Defaults = 2026-09-17 sweep best + the three entry filters validated in docs/research/2026-09-17-feature-analysis.md:
# Jun-Sep 2026 (SIP, PIT top 50): 116 trades, PF 1.25, +$168; positive on both halves and on IEX. Thin but real.
# Previous sets live in config/profiles/.

alpaca:
  paper: true            # the bot refuses to start if this is false
  data_feed: iex         # free plan: iex. After the Algo Trader Plus upgrade: sip (check with scripts/check_env.py)

universe:
  source: most_actives   # most_actives | movers | static
  top: 100
  static_symbols: []     # used when source: static
  min_price: 5.0
  max_price: 500.0
  exchanges: [NYSE, NASDAQ, ARCA]
  refresh_minutes: 30    # 0 = build once at start

scan:
  poll_interval_seconds: 15
  warmup_minutes: 60     # historical bars loaded at start to seed streaks

entry:
  green_streak_minutes: 3    # was 5 (v1-original)
  min_streak_gain_pct: 1.0   # was 0.5
  min_streak_volume: 10000
  max_positions: 5
  position_size_pct: 10
  entry_limit_buffer_pct: 0.1
  entry_fill_timeout_seconds: 30
  entry_start: "09:31"   # US/Eastern; was 09:40
  entry_end: "11:30"     # was 15:00; afternoon entries lost ~3x faster in the sweep
  max_entries_per_symbol_per_day: 1
  filters:                       # null = gate off. See docs/features/11-entry-filters.md
    min_spy_ret_session_pct: 0.1 # market (SPY) must be up on the day
    max_session_ret_pct: 0.6     # skip stocks that already ran
    max_trade_count_ratio: 0.7   # streak made by fewer, larger trades

exit:
  trail_pct: 1.5         # was 0.5
  min_gain_pct: 0.5      # was 0.3
  hard_stop_pct: 1.0     # set to 0 to disable the safety stop (not recommended)
  max_hold_minutes: 60   # was 120
  timeout_exit_only_if_profitable: true
  flatten_at_close: true
  flatten_time: "15:55"

capital:
  base_allocation: 10000
  reinvest_gains_pct: 50
  min_allocation_ratio: 0.5

backtest:
  slippage_pct: 0.05     # applied against you on every simulated fill
  feed: sip              # sip | iex ; run both and compare

strategies:                    # accounting key `id`; `mode: shadow` = simulated fills on live prices, no orders
  - id: wave_rider
    kind: wave_rider
    mode: live
    weight: 1.0                # share of the daily allocation among live strategies
  - id: spy_intraday
    kind: spy_intraday
    enabled: false             # FAILED the study (2016-2026: no effect, slightly reversed). Kept as the
    mode: shadow               # market-timing template. docs/research/2026-09-21-spy-intraday-momentum.md
    weight: 0.5
    params:
      threshold_bp: 10
      decision_time: "15:30"
      exit_time: "15:58"
  - id: wave_rider_15m           # OBSERVATION ONLY: backtest PF 1.00 with the market gate (break-even), 0.89 without.
    kind: wave_rider             # docs/research/2026-09-22-fifteen-minute-and-orb-backtests.md
    mode: shadow
    weight: 0.5
    params:
      bar_minutes: 15
      entry: {entry_start: "09:30", entry_end: "11:30", green_streak_minutes: 3, min_streak_gain_pct: 1.0,
              filters: {min_spy_ret_session_pct: 0.1, max_session_ret_pct: 0.6, max_trade_count_ratio: null}}
      exit: {trail_pct: 1.0, min_gain_pct: 0.5, hard_stop_pct: 2.0, max_hold_minutes: 180}
  - id: orb                      # OBSERVATION ONLY: long-only opening-range breakout. Backtest PF 0.91 at 0.25 ATR (0.74 at 0.1 ATR)
    kind: orb                    # once the stop hook reached the broker (2026-09-23); the earlier 0.93 used the global 1% stop.
    mode: shadow
    weight: 0.5
    params: {range_minutes: 15, rvol_min: 3.0, stop_atr: 0.25, risk_pct: 1.0, exit_time: "15:55"}
  - id: xs_overnight             # OBSERVATION ONLY: Kakushadze & Serur open-to-close alpha, long leg (feature 19). No ranking power in
    kind: xs_daytrade            # the diagnostic; best backtest row PF 0.91 on 208 trades. docs/research/2026-09-23-kakushadze-151-feasibility.md
    mode: shadow
    weight: 0.5
    params: {signal: overnight_reversal, entry_time: "09:31", stop_pct: 0, max_gap_pct: 3.0, min_score_pct: 1.5}
  - id: xs_combo                 # OBSERVATION ONLY: the two Appendix-A alphas combined (overnight reversal + previous-day momentum), PF 0.84.
    kind: xs_daytrade
    mode: shadow
    weight: 0.5
    params: {signal: combo, entry_time: "09:31", stop_pct: 0, max_gap_pct: 3.0, min_score_pct: 1.5}

portfolios:                    # daily-bar portfolios (feature 21): decided once a day at decision_time, held overnight,
  - id: pm_actives             # 12-1 price momentum, top 30% of the bot's live universe (most actives, funds removed):
    kind: price_momentum       # point-in-time by construction. Backtest 2017-26 on a survivorship-free top 100: 23.9%
    universe: scan             # a year vs 16.8% for the universe, IR +0.51 (t 1.6), positive both halves. Leading
    weight: 1.0                # daily candidate; observation. (Replaced pm_megacaps, a hindsight list, 2026-09-24.)
    params: {formation_days: 231, skip_days: 21, fraction: 0.3}
  - id: vt_spy                 # volatility targeting on SPY (15% target): same Sharpe as SPY with half the drawdown
    kind: vol_targeting        # in 2017-26. Observation.
    universe: spy
    weight: 1.0
    params: {symbol: SPY, target_vol: 0.15, vol_days: 20, max_leverage: 1.0}

options:                       # option structures (feature 22). SHADOW: legs filled against live OPRA quotes, nothing reaches
                               # Alpaca. Settings from the 2024-26 options backtest (docs/research/2026-09-24-options-backtest.md):
  - id: bps_spy                # bull put spread: sell the put ~5% out, buy the put ~10% out, ~35 days, only when ATM implied vol
    template: bull_put_spread  # exceeds 20-day realised vol by 3 points, held to the day before expiry.
    underlying: SPY            # Backtest: +28.8%, Sharpe 1.13 (SPY 1.16), max DD -7.2% (SPY -19.0%), 20 trades, 95% wins.
    weight: 2.0
    strike_step_pct: 0.025
    entry_gate: vrp
    vrp_threshold: 0.03
    profit_target_pct: 1.0
    stop_mult: 10.0
    close_dte: 1
  - id: bps_qqq                # same on QQQ. Backtest: +52.6%, Sharpe 1.56 (QQQ 1.08), max DD -9.8% (QQQ -22.9%), 21 trades.
    template: bull_put_spread
    underlying: QQQ
    weight: 2.0
    strike_step_pct: 0.025
    entry_gate: vrp
    vrp_threshold: 0.03
    profit_target_pct: 1.0
    stop_mult: 10.0
    close_dte: 1
  - id: cc_qqq                 # covered call on QQQ: 100 shares + the call ~5% out, same gate and exits. Backtest: +30.0%,
    template: covered_call     # Sharpe 1.64, max DD -6.2%, 21 trades; mostly the stock's own return with the upside capped.
    underlying: QQQ
    weight: 8.0                # 100 QQQ shares need about $72k of fictional capital
    strike_step_pct: 0.025
    entry_gate: vrp
    vrp_threshold: 0.03
    profit_target_pct: 1.0
    stop_mult: 10.0
    close_dte: 1

risk:                          # kill switches, see docs/features/14-operator.md
  max_daily_loss_pct: 2.0      # realised loss as % of allocation -> flatten and halt entries (0 disables)
  max_open_loss_pct: 3.0       # realised + unrealised
  winrate_floor_enabled: true
  winrate_lookback_trades: 60
  winrate_min_trades: 30
  winrate_breakeven: null      # null = from average win / average loss of the lookback
  winrate_halt_probability: 0.9

operator:
  report_times_et: ["09:00", "11:30", "14:00", "16:15", "21:00"]
  heartbeat_stale_seconds: 90
  notify: true                 # macOS notifications for alerts
  report_dir: data/reports

storage:
  db_path: data/ridethewave.db
  log_dir: data/logs
